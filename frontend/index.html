</style></head><body><div id="root"></div>
<script type="module">
import { Queue } from '/dsa/Queue.js';
import { PriorityQueue } from '/dsa/PriorityQueue.js';
import { Graph } from '/dsa/Graph.js';
const CATS=['Bonafide Certificate','Leave Request','Lab Issue','Scholarship Issue','Academic Query','Other'];
const PRI={HIGH:3,MEDIUM:2,LOW:1},SRANK={SUBMITTED:1,PENDING:2,ASSIGNED:3,IN_PROGRESS:4,ESCALATED:5,RESOLVED:6,REJECTED:7};
const $=s=>document.querySelector(s);
let token=null,me=null,tab='dash',err='',okMsg='',reg=false,page='home',st={},sortBy='date',dir='desc',fStatus='',fType='',fPri='',search='',ss='';
const pn=p=>Object.keys(PRI).find(k=>PRI[k]===p);
async function api(m,p,b){
  const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',...(token&&{Authorization:'Bearer '+token})},body:b?JSON.stringify(b):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&token){token=null;me=null;render()}throw new Error(d.error||'Request failed')}return d}
const mapReq=r=>({id:r.request_id,pri:r.priority,type:r.type,desc:r.description,status:r.status,fac:r.assigned_faculty,fname:r.faculty_name,sname:r.student_name,usn:r.usn,level:r.escalation_level,created:r.created_at});
const fdate=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const bd=t=>`<span class="b ${t}">${t.replace('_',' ')}</span>`;
const cards=a=>`<div class="grid">${a.map(([l,v])=>`<div class="card stat" style="margin:0"><b>${v??0}</b><span>${l}</span></div>`).join('')}</div>`;
function graphSVG(hl=[]){
  const N=['STUDENT','FACULTY','HOD','PRINCIPAL'],col=n=>hl.includes(n)?'#2952e3':'#8a93a8';
  return `<svg viewBox="0 0 640 70" style="width:100%;max-width:640px">${N.map((n,i)=>`${i?`<line x1="${(i-1)*170+110}" y1="35" x2="${i*170+10}" y2="35" stroke="${col(n)}" stroke-width="2"/><text x="${i*170-5}" y="30" fill="${col(n)}">▶</text>`:''}<rect x="${i*170+10}" y="15" width="100" height="40" rx="8" fill="none" stroke="${col(n)}" stroke-width="2"/><text x="${i*170+60}" y="40" text-anchor="middle" fill="currentColor" font-size="12">${n}</text>`).join('')}</svg>`}

async function load(){
  const R=me.role;
  [st.notes,st.dash]=await Promise.all([api('GET','/api/notifications'),api('GET','/api/dashboard')]);
  if(R==='STUDENT')st.reqs=(await api('GET','/api/requests/mine')).map(mapReq);
  if(R==='FACULTY')st.reqs=(await api('GET','/api/requests/assigned')).map(mapReq);
  if(R==='HOD'){
    const qs=new URLSearchParams({sort:sortBy,dir});if(fStatus)qs.set('status',fStatus);if(fType)qs.set('type',fType);if(fPri)qs.set('priority',fPri);
    st.list=await api('GET','/api/requests?'+qs);st.reqs=st.list.requests.map(mapReq);st.search=null;
    if(search){try{st.search=await api('GET','/api/search?q='+encodeURIComponent(search));st.reqs=st.search.requests.map(mapReq)}catch(e){alert(e.message)}}
    [st.dsa,st.regs,st.students,st.fac]=await Promise.all([api('GET','/api/dsa/state'),api('GET','/api/registrations'),api('GET','/api/students'),api('GET','/api/faculty')]);
  }
  render()}
const act=async(path,body)=>{try{const d=await api('POST',path,body||{});await load();return d}catch(e){alert(e.message)}};
function table(rows,actions){
  return `<div class="wrap"><table><tr><th>ID</th><th>Student</th><th>Type</th><th>Priority</th><th>Status</th><th>Faculty</th><th>Created</th><th></th></tr>${rows.map(r=>`<tr><td><a href="#" onclick="detail('${r.id}');return false">${r.id}</a></td><td>${r.sname}<br><small>${r.usn}</small></td><td>${r.type}</td><td>${bd(r.pri)}</td><td>${bd(r.status)}</td><td>${r.fname||'—'}</td><td>${fdate(r.created)}</td><td>${actions?actions(r):''}</td></tr>`).join('')||'<tr><td colspan=8>No requests.</td></tr>'}</table></div>`}
async function detail(id){

  const rows=[['01','Priority Queue','Lab and scholarship problems jump the line. A max-heap decides who is next.','O(log n)'],['02','Queue','Everything else is served in the order it arrived.','O(1)'],['03','Hash Map','Type a USN and the student appears, without scanning anyone else.','O(1) average'],['04','Stack','Every status change is stacked. The top is where the request stands now.','O(1)'],['05','Merge Sort','Sort the whole desk by priority, date, status or category.','O(n log n)'],['06','Graph + BFS','If faculty cannot solve it, breadth-first search finds the next authority up.','O(V + E)']];
  return `<div class="land3"><div class="land2 ${intro}"><header class="lnav2"><div class="brand">${LOGO}</div><div><a onclick="showReg()">Register</a><button onclick="showLogin()">Sign in</button></div></header>
  <section class="split"><div class="copy"><p class="kicker">QueryDesk · the department request desk</p><h1>Every request gets a <span class="ul">number</span> and a place in line.</h1><p class="lead">Students submit, the HOD calls the next one, faculty resolve or pass it up. The scene beside this text is the real Queue, heap and graph code, running live.</p><div class="cta"><button class="big" onclick="showLogin()">Sign in</button><a onclick="showReg()">Register as student →</a></div><small>Move your mouse over the scene to turn it · works on any phone</small></div><div id="stage"></div></section>
  <div class="dock"><button onclick="demoNext()">Call next</button><button class="g" onclick="demoAuto()">${demo.timer?'Pause':'Auto ▶'}</button><span class="dsp">ADD</span><button class="g" onclick="demoAdd('Lab Issue')">Lab</button><button class="g" onclick="demoAdd('Leave Request')">Leave</button><button class="g" onclick="demoAdd('Bonafide Certificate')">Bonafide</button><button class="g" onclick="demoEsc()">Escalate</button><button class="g" onclick="demoReset()">Reset</button><span class="dsp">WAITING <b>${demo.pq.h.length+demo.q.size}</b> · SERVED <b>${demo.cnt}</b></span>
  <div class="esc" style="flex-basis:100%;justify-content:center;border:0;padding-top:4px;margin:0">${escPath.map((n,i)=>`<span class="en ${i<=demo.esc?'on':''}">${n}</span>`).join('<u></u>')}</div></div>
  <section class="ledger"><h2>What decides who is served next</h2><p class="sub">Each structure does one job in the running system.</p>${rows.map(r=>`<div class="lrow"><i>${r[0]}</i><b>${r[1]}</b><span>${r[2]}</span><code>${r[3]}</code></div>`).join('')}</section>
  <section class="ledger"><h2>The life of a request</h2><p class="sub">Each step is written to the request's history.</p><div class="track"><span>SUBMITTED</span><u></u><span>ASSIGNED</span><u></u><span>IN PROGRESS</span><u></u><span>RESOLVED</span></div></section>
  <footer class="lfoot2"><span>QueryDesk · Kagada</span><span>Department of ECE, UVCE</span></footer></div></div>`}
function openPalette(){
  if(!me||document.querySelector('.pal'))return;
  const m=document.createElement('div');m.className='ov pal';m.onclick=e=>{if(e.target===m)m.remove()};
  const items=[...document.querySelectorAll('.side a')].filter(a=>!a.dataset.skip).map(a=>({t:a.textContent.trim(),f:()=>a.click()}));
  m.innerHTML='<div class="card"><input id="pi" placeholder="Jump to a page, or type a request ID like Q1001" style="width:100%;margin-bottom:6px"><div id="pl"></div></div>';document.body.appendChild(m);
  const inp=m.querySelector('#pi'),list=m.querySelector('#pl');let cur=[];
  const draw=()=>{const v=inp.value.trim();cur=items.filter(i=>i.t.toLowerCase().includes(v.toLowerCase()));if(/^q\d{3,}$/i.test(v))cur.unshift({t:'Open request '+v.toUpperCase(),f:()=>detail(v)});
    list.innerHTML=cur.map((c,i)=>`<div class="pit ${i?'':'sel'}" data-i="${i}">${c.t}</div>`).join('')||'<div class="pit">No match</div>'};
  const run=i=>{if(cur[i]){m.remove();cur[i].f()}};
  inp.oninput=draw;inp.onkeydown=e=>{if(e.key==='Enter')run(0);if(e.key==='Escape')m.remove()};list.onclick=e=>{const t=e.target.closest('.pit');if(t&&t.dataset.i)run(+t.dataset.i)};draw();inp.focus()}
const loginCard=()=>`<div class="authwrap"><div class="login card"><div class="brand c">${LOGO}</div><h2 style="text-align:center">Sign in</h2><p class="cx" style="text-align:center;margin:0 0 18px">Students use their USN. Faculty and HOD use their email.</p>
  <label>USN or email</label><input id="li" placeholder="1EC23EC001 or name@college.edu"><label>Password</label><input id="lp" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
  <button class="wide" onclick="login()">Sign in</button><div class="err">${err}</div><div class="ok">${okMsg}</div><p class="cx" style="text-align:center">New student? <a href="#" onclick="showReg();return false">Register here</a> · <a href="#" onclick="goHome();return false">Back to home</a></p></div></div>`;
function charts(d){
  const rest=Math.max(0,(d.total||0)-(d.pending||0)-(d.inProgress||0)-(d.resolved||0)-(d.escalated||0));
  const segs=[['Pending',d.pending,'#f59e0b'],['In progress',d.inProgress,'#6366f1'],['Resolved',d.resolved,'#16a34a'],['Escalated',d.escalated,'#dc2626'],['Assigned / other',rest,'#a1a1aa']];
  const tot=Math.max(1,d.total||0),C=2*Math.PI*40;let acc=0;
  const arcs=segs.map(([l,v,c])=>{const len=(v||0)/tot*C,el=`<circle r="40" cx="60" cy="60" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;acc+=len;return el}).join('');
  const bars=(rows,max)=>rows.map(([l,v])=>`<div class="bar"><span>${l}</span><i style="width:${Math.max(3,v/max*100)}%"></i><b>${v}</b></div>`).join('');
  const cats=(d.byCategory||[]).map(c=>[c.type,c.count]),fac=st.fac.filter(f=>f.role==='FACULTY').map(f=>[f.name,f.open_requests]);
  return `<div class="grid3"><div class="card"><h4>Requests by status</h4><div class="donut"><svg viewBox="0 0 120 120" width="140" height="140">${arcs}<text x="60" y="58" text-anchor="middle" font-size="20" font-weight="600" fill="currentColor">${d.total||0}</text><text x="60" y="74" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">total</text></svg><div class="legend">${segs.map(([l,v,c])=>`<div><span class="dot" style="background:${c}"></span>${l} <b>${v||0}</b></div>`).join('')}</div></div></div>
  <div class="card"><h4>By category</h4>${bars(cats,Math.max(1,...cats.map(x=>x[1])))}</div><div class="card"><h4>Faculty workload</h4>${bars(fac,Math.max(1,...fac.map(x=>x[1])))}<div class="cx">Open requests per faculty member</div></div></div>`}
async function login(){
  const id=$('#li').value.trim(),pw=$('#lp').value;if(!id||!pw){err='Please fill in all fields.';return render()}
  try{const d=await api('POST','/api/login',{identifier:id,password:pw});token=d.token;me=d.user;err='';okMsg='';tab='dash';await load()}catch(e){err=e.message;render()}}
async function register(){
  const g=i=>$('#'+i).value.trim(),e=m=>{document.querySelector('.err').textContent=m};
  try{const d=await api('POST','/api/register',{usn:g('ru'),name:g('rn'),email:g('re'),department:g('rd'),year:g('ry'),password:$('#rp').value});reg=false;err='';page='login';okMsg=d.message+' You can log in after approval.';render()}catch(x){e(x.message)}}
const regForm=()=>`<div class="login card"><h2>Student Registration</h2><p class="cx">Your request is sent to the HOD for approval.</p><div class="row"><input id="ru" placeholder="USN (e.g. 1EC23EC004)" style="flex:1"></div><div class="row"><input id="rn" placeholder="Full name" style="flex:1"></div><div class="row"><input id="re" placeholder="Email" style="flex:1"></div><div class="row"><input id="rd" placeholder="Department" value="ECE" style="flex:1"><select id="ry"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="row"><input id="rp" type="password" placeholder="Password (min 6 characters)" style="flex:1"></div><button onclick="register()">Submit for approval</button><button class="g" onclick="hideReg()">Back</button><div class="err"></div></div>`;
const showReg=()=>{reg=true;err='';okMsg='';render()},hideReg=()=>{reg=false;err='';render()};
const setTab=t=>{tab=t;render()};
const logout=async()=>{try{await api('POST','/api/logout')}catch(e){}token=null;me=null;st={};page='home';render()};
function render(){
  const root=$('#root');document.body.classList.toggle('dk',live());
  if(!me&&reg){root.innerHTML=regForm();return}
  if(!me&&page==='home'){root.innerHTML=landing();const h=document.getElementById('stage');if(h)h.appendChild(STAGE);return}
  if(!me){root.innerHTML=loginCard();return}
  const nav=me.role==='HOD'?[['dash','Dashboard'],['reqs','Requests'],['queues','Queues'],['students','Students'+((st.dash||{}).pendingRegistrations?' ('+st.dash.pendingRegistrations+')':'')],['faculty','Faculty'],['graph','Escalation Graph']]:me.role==='FACULTY'?[['dash','Dashboard'],['history','History']]:[['dash','Dashboard'],['new','New Request']];
  const body=!st.dash?'Loading…':me.role==='HOD'?hodView():me.role==='FACULTY'?facView():stuView();
  root.innerHTML=`<div class="app"><div class="side ${me.role}"><div class="brand">${LOGO}</div><h3>${me.role}<br><small>${me.name}</small></h3>${nav.map(([k,l])=>`<a class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</a>`).join('')}<a data-skip="1" onclick="openPalette()">Quick jump · Ctrl K</a><a onclick="logout()">Logout</a></div><main>${body}</main></div>`}
Object.assign(window,{$,login,register,logout,setTab,detail,act,assign,setPri,resolveReq,rejectReq,holdReq,escalate,submitReq,setF,lookup,delStudent,addFaculty,toggleFac,resetFac,regAct,showReg,hideReg,download,upload,showLogin,goHome,demoAdd,demoNext,demoReset,demoAuto,demoEsc,openPalette});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}});
render();
</script></body></html>
